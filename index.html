<style>
:root{--bg:#0a0516;--e:#5c16eb;--c:#00ffdd;--t:#f6f3ff;--m:#b9afd6;--g:rgba(255,255,255,.06);--b:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(900px 520px at 85% -5%,#3a14a8aa,transparent),radial-gradient(700px 420px at 0 35%,#00ffdd14,transparent);background-color:var(--bg);color:var(--t);font:400 16px/1.6 Sora,Cairo,system-ui,sans-serif;overflow-x:hidden}
[dir=rtl] body{font-family:Cairo,Sora,system-ui,sans-serif;line-height:1.85}
[dir=rtl] *{letter-spacing:0!important}
.w{max-width:1120px;margin:auto;padding-inline:20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0a0516d9;backdrop-filter:blur(16px);border-bottom:1px solid var(--b)}
.hd{display:flex;align-items:center;gap:14px;height:68px}
.logo{height:44px;width:auto;display:block}
nav{display:flex;gap:20px;align-items:center;margin-inline-end:auto;margin-inline-start:24px}
nav a{color:var(--m);text-decoration:none;font-size:14px}nav a:hover{color:var(--c)}
nav .btn{color:#fff;padding:9px 16px;font-size:13px;box-shadow:none}
.lg{display:flex;border:1px solid var(--b);border-radius:99px;overflow:hidden}
.lg button{background:none;border:0;color:var(--m);padding:7px 12px;font:600 12px Sora,sans-serif;cursor:pointer}
.lg [aria-pressed=true]{background:var(--c);color:#06121a}
.mb{display:none;background:none;border:1px solid var(--b);color:var(--t);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.btn{display:inline-block;background:linear-gradient(120deg,var(--e),#8a4bff);color:#fff;border:0;border-radius:12px;padding:15px 26px;font-weight:600;font-size:15px;font-family:inherit;text-decoration:none;cursor:pointer;box-shadow:0 8px 30px #5c16eb66}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--c);outline-offset:2px}
section{padding-block:64px}
h1,h2,h3{margin:0 0 12px}
h1{font-size:clamp(34px,6vw,62px);line-height:1.1;letter-spacing:-.02em;margin-bottom:18px}
h2{font-size:clamp(26px,4vw,40px);line-height:1.2}
.lead,.sub{color:var(--m);max-width:62ch}.lead{font-size:18px;margin:0 0 28px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding-block:64px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px}
.cd{background:var(--g);border:1px solid var(--b);border-radius:18px;padding:24px;backdrop-filter:blur(10px)}
.cd p{color:var(--m);margin:0}

.cd ul{margin:0;padding-inline-start:20px;color:var(--m)}
.pn{color:var(--m);font-size:14px;margin-top:20px}
.lap{background:#120a28;border:1px solid var(--b);border-radius:12px 12px 4px 4px;padding:8px 8px 14px;position:relative;box-shadow:0 30px 60px #0008,0 0 40px #5c16eb44;margin-bottom:22px}
.scr{aspect-ratio:16/10;border-radius:6px;background:linear-gradient(135deg,var(--x),var(--y));padding:10px;display:grid;grid-template-rows:auto 1fr auto;gap:6px;overflow:hidden;color:#fff}
.nv{display:block;height:6px;width:60%;border-radius:9px;background:#fff5}
.hr{display:flex;flex-direction:column;justify-content:center;gap:7px}
.hr b{font-size:clamp(10px,1.7vw,16px);line-height:1.2}.hr u{width:34%;height:8px;border-radius:9px;background:var(--c)}
.rw{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.rw s{height:clamp(14px,3vw,28px);border-radius:5px;background:#ffffff22}
.ph{position:absolute;inset-inline-end:-10px;bottom:-20px;width:24%;aspect-ratio:9/17;border:3px solid #1b1040;border-radius:14px;background:linear-gradient(160deg,var(--x),var(--y));padding:6px;display:flex;flex-direction:column;gap:5px;box-shadow:0 14px 30px #000a}
.ph i{height:4px;border-radius:9px;background:#fff6}.ph u{flex:1;border-radius:6px;background:#ffffff22}
.stage{max-width:620px;margin:40px auto 0;text-align:center}
#hm .lap{animation:fi .6s}@keyframes fi{from{opacity:.2;transform:translateY(8px)}}
#hmc{color:var(--c);font-weight:600;margin-top:8px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 22px;margin-top:28px}.pg p{margin:6px 0 0;color:var(--m);font-size:14px}
.fl{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:44px 0}
.fl span{background:var(--g);border:1px solid var(--b);border-radius:99px;padding:10px 20px;font-weight:600}
.fl span:first-child{border-color:var(--e)}.fl span:last-child{border-color:var(--c);color:var(--c)}
.arw{color:var(--c);font-style:normal;font-size:22px}[dir=rtl] .arw{transform:scaleX(-1)}
.st{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.st li{background:var(--g);border:1px solid var(--b);border-radius:18px;padding:22px}
.st b{display:block;font-size:34px;color:var(--c);line-height:1}.st p{margin:0;color:var(--m)}
.vd{background:#5c16eb22;border:1px solid var(--e);border-radius:14px;padding:16px 20px;margin:28px 0;text-align:center}
.fw{max-width:820px;margin:0 auto}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:16px}.f{display:flex;flex-direction:column;gap:6px}.w2{grid-column:1/-1}
label{font-weight:600;font-size:14px}
input,select,textarea{width:100%;background:#ffffff0d;border:1px solid var(--b);border-radius:10px;padding:12px 14px;color:var(--t);font:inherit}
select option{color:#000}textarea{min-height:96px;resize:vertical}[aria-invalid=true]{border-color:#ff8fa3}
.er{color:#ff8fa3;font-size:13px}.hp{font-size:13px;color:var(--m)}
.ok{text-align:center;padding:24px 8px}.ok svg{width:64px;height:64px;margin-bottom:12px}.ok p{max-width:48ch;margin:0 auto}
details{border-bottom:1px solid var(--b);padding:16px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--m);margin:10px 0 0}
footer{border-top:1px solid var(--b);padding:40px 0;text-align:center;color:var(--m);font-size:14px}footer .logo{margin:0 auto 14px;height:56px}
.pc{font-size:40px;line-height:1.1;font-weight:700;color:var(--t)!important;margin-bottom:12px!important}.pc small{font-size:15px;font-weight:400;color:var(--m)}
.cd.pk{display:flex;flex-direction:column}.cd.pk h3{font-size:22px;letter-spacing:.04em;margin-bottom:4px}
.cd .ty{color:var(--c);font-size:13px;font-weight:600;margin-bottom:12px}.cd .pp{font-size:14px;margin-bottom:16px}
.cd.pk ul{list-style:none;padding:0;flex:1;margin:0 0 22px}.pk li{position:relative;padding-inline-start:24px;margin-bottom:8px}
.pk li:before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:10px;height:5px;border-left:2px solid var(--c);border-bottom:2px solid var(--c);transform:rotate(-45deg)}
.cd.pk .btn{text-align:center}
.cd.hi{border-color:var(--c);background:linear-gradient(160deg,#5c16eb45,var(--g));box-shadow:0 0 50px #5c16eb66,0 24px 50px #0009;transform:translateY(-8px)}
.cd.mo{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;align-items:center;margin-top:24px;border:1px dashed var(--c);background:linear-gradient(120deg,#00ffdd14,var(--g))}
@media(max-width:820px){.cd.hi{transform:none}.cd.mo{grid-template-columns:1fr}}
[hidden]{display:none!important}.f{position:relative}
